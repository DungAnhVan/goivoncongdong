name: Publish SIHUB Excel

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.issue.title == '[automation] Publish SIHUB Excel'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild workbook from prepared Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.request

          owner = "DungAnhVan"
          repo = "goivoncongdong"
          blob_sha = "c64e453938bc2b09a98eb335c091b74ff3ed6fc6"
          url = f"https://api.github.com/repos/{owner}/{repo}/git/blobs/{blob_sha}"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          encoded_text = base64.b64decode(payload["content"]).decode("utf-8")
          workbook_bytes = base64.b64decode(encoded_text)

          output = pathlib.Path("Nguồn/Tổ chức hệ sinh thái/SIHUB/SIHUB - Dữ liệu tổng hợp 2026.xlsx")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_bytes(workbook_bytes)
          print(f"Wrote {output} ({len(workbook_bytes)} bytes)")
          PY

      - name: Commit workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Nguồn/Tổ chức hệ sinh thái/SIHUB/SIHUB - Dữ liệu tổng hợp 2026.xlsx"
          git diff --cached --quiet || git commit -m "Thêm dữ liệu tổng hợp SIHUB"
          git push
