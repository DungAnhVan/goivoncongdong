name: Label AI-authored Obsidian notes

on:
  push:
    branches: [main]
    paths:
      - '.github/ai-label-trigger'

permissions:
  contents: write

jobs:
  label-notes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add ai_authored property
        shell: python
        run: |
          from pathlib import Path
          import re

          prefixes = (
              '00 Là gì/',
              '01 Nguồn/Chính sách công/',
              '01 Nguồn/Pháp luật và quy chuẩn/',
              '01 Nguồn/Tổ chức hệ sinh thái/SIHUB/',
              '01 Nguồn/Tổ chức hệ sinh thái/Startup Wheel/',
              '02 Mở rộng/Chính sách công/',
              'Hiến chương/',
              '_Mẫu/',
          )

          exact = {
              '01 Nguồn/Tài liệu/Các tiền thân lịch sử.md',
              '01 Nguồn/Mô hình tham khảo/TAM SAM SOM EVG.md',
              '02 Mở rộng/Các khái niệm nền tảng ứng viên.md',
              '02 Mở rộng/Khung thiết kê nền tảng cho gọi vốn cộng đồng.md',
              '02 Mở rộng/Liên kết mô hình khác.md',
              '02 Mở rộng/Định nghĩa làm việc về Crowdfunding.md',
              '03 Vấn đề/Các câu hỏi cần được trả lời.md',
              '03 Vấn đề/Khoảng trống pháp luật quốc tế cần nghiên cứu tiếp.md',
              '03 Vấn đề/Khoảng trống từ ý tưởng đến đủ điều kiện nhận hỗ trợ công.md',
              '03 Vấn đề/Ranh giới pháp lý của nền tảng gọi vốn cộng đồng tại Việt Nam.md',
              '03 Vấn đề/Thiếu năng lực tài chính và quản lý quỹ.md',
              '05 Phương án/Áp dụng TAM SAM SOM EVG.md',
              '06 Thực làm/Buổi thảo luận sắp tới.md',
              '06 Thực làm/Xác định TAM SAM SOM EVG cho dự án.md',
              'Gọi vốn cộng đồng.md',
              'Kiến trúc hiến chương và suy dẫn luật.md',
          }

          def selected(rel: str) -> bool:
              if rel in exact:
                  return True
              if rel.startswith('06 Thực làm/Onboarding') and rel.endswith('.md'):
                  return True
              return any(rel.startswith(p) for p in prefixes)

          def add_property(text: str) -> str:
              if re.search(r'(?m)^ai_authored\s*:', text):
                  return text
              nl = '\r\n' if '\r\n' in text[:200] else '\n'
              if text.startswith('---' + nl):
                  return '---' + nl + 'ai_authored: true' + nl + text[len('---' + nl):]
              return '---' + nl + 'ai_authored: true' + nl + '---' + nl + nl + text

          changed = []
          for path in Path('.').rglob('*.md'):
              rel = path.as_posix()
              if rel.startswith('.git/') or not selected(rel):
                  continue
              raw = path.read_text(encoding='utf-8')
              if not raw.strip():
                  continue
              updated = add_property(raw)
              if updated != raw:
                  path.write_text(updated, encoding='utf-8', newline='')
                  changed.append(rel)

          print(f'AI provenance added to {len(changed)} markdown files')
          for item in changed:
              print(item)

      - name: Commit labels
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          git commit -m "Gắn nhãn AI cho các ghi chú do AI soạn"
          git push
